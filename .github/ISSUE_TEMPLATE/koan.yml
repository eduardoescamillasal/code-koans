name: Koan proposal
description: Propose a mechanism, misconception, and transfer problem
title: "[Koan] "
body:
  - type: textarea
    id: objective
    attributes:
      label: Mechanism and learning objective
      description: Identify the prerequisite modules and a misconception the koan should surface.
    validations:
      required: true
  - type: textarea
    id: progression
    attributes:
      label: Five-stage progression
      description: Describe the contrast, implementation, edge cases, and unfamiliar transfer task.
    validations:
      required: true
